# 체크리스트 기준 주석: 개발환경 세팅: DB, MongoDB, 메일, 외부 API, 파일 업로드 설정을 관리한다.
spring.config.import=optional:file:.env.properties

# JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.port=11000
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.tomcat.uri-encoding=UTF-8
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${APP_COOKIE_SAME_SITE:lax}

# Security
# Comma-separated public origins allowed to call browser APIs.
# Example: https://deepscan.example.com
app.security.allowed-origins=${APP_ALLOWED_ORIGINS:}

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=32MB
spring.servlet.multipart.max-request-size=32MB
app.upload-dir=uploads

# Object storage
# S3 is opt-in. When disabled, files are saved under app.upload-dir.
app.storage.type=${APP_STORAGE_TYPE:local}
app.s3.enabled=${AWS_S3_ENABLED:false}
app.s3.region=${AWS_REGION:ap-northeast-2}
app.s3.bucket=${AWS_S3_BUCKET:}
app.s3.access-key=${AWS_ACCESS_KEY_ID:}
app.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
app.s3.use-default-credentials=${AWS_USE_DEFAULT_CREDENTIALS:false}
app.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}
app.s3.public-read-acl=${AWS_S3_PUBLIC_READ_ACL:false}

# HTTP clients
app.http.connect-timeout-ms=${APP_HTTP_CONNECT_TIMEOUT_MS:3000}
app.http.read-timeout-ms=${APP_HTTP_READ_TIMEOUT_MS:5000}

# MyBatis
mybatis.mapper-locations=classpath:/mapper/*.xml
mybatis.type-aliases-package=kopo.poly.dto

# DB
spring.datasource.url=${DB_URL:jdbc:h2:mem:deepfake2;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.initializationFailTimeout=${DB_INITIALIZATION_FAIL_TIMEOUT_MS:1}
spring.datasource.hikari.connectionTimeout=5000
spring.datasource.hikari.validationTimeout=3000
spring.datasource.hikari.maximumPoolSize=5
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# Mail
spring.mail.host=smtp.naver.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.naver.com
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.debug=false
app.mail.from=${APP_MAIL_FROM:${spring.mail.username:}}
app.mail.subjectPrefix=[DeepScan]

# =========================
# Reality Defender (verify flow)
# =========================
deepfake.client.mode=${DEEPFAKE_CLIENT_MODE:real}
rd.baseUrl=${RD_BASE_URL:${REALITY_DEFENDER_BASE_URL:https://api.prd.realitydefender.xyz}}
rd.apiKey=${RD_API_KEY:${REALITY_DEFENDER_API_KEY:}}
rd.poll.max-attempts=${RD_POLL_MAX_ATTEMPTS:100}
rd.poll.interval-ms=${RD_POLL_INTERVAL_MS:3000}
rd.dummy.verdict=SUSPICIOUS
rd.dummy.score=0.82

# IMD local Python service
# Run imd-service/app.py. With DEEPFAKE_CLIENT_MODE=real, IMD is used only for visualization heatmaps.
imd.base-url=${IMD_BASE_URL:http://127.0.0.1:8000}
imd.heatmap.enabled=${IMD_HEATMAP_ENABLED:true}
imd.auto-start.enabled=${IMD_AUTO_START_ENABLED:false}
imd.service-dir=${IMD_SERVICE_DIR:imd-service}
imd.repo-path=${IMD_REPO:C:\\SpringBootWorks\\IMD}
imd.startup-timeout-ms=${IMD_STARTUP_TIMEOUT_MS:15000}
imd.request-timeout-ms=${IMD_REQUEST_TIMEOUT_MS:45000}

# Naver News
naver.client-id=${NAVER_CLIENT_ID:}
naver.client-secret=${NAVER_CLIENT_SECRET:}
naver.news-url=${NAVER_NEWS_URL:https://openapi.naver.com/v1/search/news.json}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/deepfake2}

# Reality Defender detect page
reality.defender.base-url=${REALITY_DEFENDER_BASE_URL:${RD_BASE_URL:https://api.prd.realitydefender.xyz}}
reality.defender.api-key=${REALITY_DEFENDER_API_KEY:${RD_API_KEY:}}
reality.defender.mock-mode=${REALITY_DEFENDER_MOCK_MODE:false}

# Detail page
app.detail.show-analysis-source-badge=${APP_DETAIL_SHOW_ANALYSIS_SOURCE_BADGE:true}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Gemini AI explanation
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.vision-model=${GEMINI_VISION_MODEL:gemini-3.6-flash}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT_MS:5000}
gemini.read-timeout-ms=${GEMINI_READ_TIMEOUT_MS:30000}
gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:450}
gemini.vision-max-output-tokens=${GEMINI_VISION_MAX_OUTPUT_TOKENS:600}
gemini.vision-max-image-bytes=${GEMINI_VISION_MAX_IMAGE_BYTES:8388608}
gemini.cache.enabled=${GEMINI_CACHE_ENABLED:true}
gemini.cache.ttl-minutes=${GEMINI_CACHE_TTL_MINUTES:30}
gemini.cache.max-entries=${GEMINI_CACHE_MAX_ENTRIES:500}
