spring.config.import=optional:file:.env.properties

# JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.port=11000
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.tomcat.uri-encoding=UTF-8

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=32MB
spring.servlet.multipart.max-request-size=32MB
app.upload-dir=uploads

# MyBatis
mybatis.mapper-locations=classpath:/mapper/*.xml
mybatis.type-aliases-package=kopo.poly.dto

# DB
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mariadb://192.168.80.129:3306/myDB?characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:poly}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.hikari.initializationFailTimeout=0
spring.datasource.hikari.connectionTimeout=5000
spring.datasource.hikari.validationTimeout=3000
spring.datasource.hikari.maximumPoolSize=5

# Mail
spring.mail.host=smtp.naver.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.naver.com
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.debug=false
app.mail.from=${APP_MAIL_FROM:${spring.mail.username:}}
app.mail.subjectPrefix=[DeepScan]
app.auth.devVerificationCode=123456

# =========================
# Reality Defender (verify flow)
# =========================
deepfake.client.mode=${DEEPFAKE_CLIENT_MODE:real}
rd.baseUrl=${RD_BASE_URL:${REALITY_DEFENDER_BASE_URL:https://api.prd.realitydefender.xyz}}
rd.apiKey=${RD_API_KEY:${REALITY_DEFENDER_API_KEY:}}
rd.dummy.verdict=SUSPICIOUS
rd.dummy.score=0.82

# Naver News
naver.search.client-id=${NAVER_SEARCH_CLIENT_ID:}
naver.search.client-secret=${NAVER_SEARCH_CLIENT_SECRET:}
naver.search.news-url=${NAVER_SEARCH_NEWS_URL:https://openapi.naver.com/v1/search/news.json}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://myUser:1234@192.168.80.129:27017/MyDB}

# Reality Defender detect page
reality.defender.base-url=${REALITY_DEFENDER_BASE_URL:${RD_BASE_URL:https://api.prd.realitydefender.xyz}}
reality.defender.api-key=${REALITY_DEFENDER_API_KEY:${RD_API_KEY:}}
reality.defender.mock-mode=${REALITY_DEFENDER_MOCK_MODE:false}

# Detail page
app.detail.show-analysis-source-badge=${APP_DETAIL_SHOW_ANALYSIS_SOURCE_BADGE:true}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:927801788556-ibm86i2vsptffdeen4aqdm3dg4onplj6.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET: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}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
